name: Seed feature checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sentiment-service/requirements.txt
      - run: python -m pip install -r sentiment-service/requirements.txt
      - run: npm run test:seed
        env:
          SEED_REAL_SENTIMENT_PYTHON: python
      - run: npm run lint --prefix client
      - run: npm run build --prefix client
